services:
  db:
    image: mysql:8.0
    container_name: clinic-practice-db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: clinic_practice
      MYSQL_USER: clinic
      MYSQL_PASSWORD: clinic_pass
      MYSQL_ROOT_PASSWORD: clinic_root
    volumes:
      - clinic_practice_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uclinic", "-pclinic_pass"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  clinic_practice_mysql_data: